<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42C8FF" />
      <stop offset="100%" stop-color="#488CFF" />
    </linearGradient>
    <linearGradient id="favLavViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BCA6FF" />
      <stop offset="100%" stop-color="#9667F4" />
    </linearGradient>
    <linearGradient id="favPeachChamp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB6A0" />
      <stop offset="100%" stop-color="#FFE0B5" />
    </linearGradient>
    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D6" />
      <stop offset="55%" stop-color="#FFE0B5" />
      <stop offset="100%" stop-color="#FFB6A0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Cosmic Background -->
  <circle cx="50" cy="50" r="48" fill="#080F29" />

  <!-- Outer Halo Ring -->
  <circle cx="50" cy="50" r="41" stroke="url(#favCyanBlue)" stroke-width="2.5" opacity="0.45" />

  <!-- Left Ribbon Loop (Cyan / Blue) -->
  <path
    d="M 50 14 C 28 14 14 32 14 50 C 14 68 32 86 50 86 C 36 74 30 58 38 42 C 44 30 50 20 50 14 Z"
    fill="url(#favCyanBlue)"
    opacity="0.95"
  />

  <!-- Right Ribbon Loop (Lavender / Violet) -->
  <path
    d="M 50 14 C 72 14 86 32 86 50 C 86 68 68 86 50 86 C 64 74 70 58 62 42 C 56 30 50 20 50 14 Z"
    fill="url(#favLavViolet)"
    opacity="0.9"
  />

  <!-- Cradling Horizontal Ribbon (Warm Peach / Champagne) -->
  <path
    d="M 22 50 C 34 36 66 36 78 50 C 66 64 34 64 22 50 Z"
    fill="url(#favPeachChamp)"
    opacity="0.92"
  />

  <!-- Luminous Central Focal Core -->
  <circle cx="50" cy="50" r="14" fill="url(#favCoreGlow)" />
  <circle cx="50" cy="50" r="5" fill="#FFF4D6" />
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
</svg>
