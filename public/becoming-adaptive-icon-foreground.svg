<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" fill="none">
  <!-- Android Adaptive Icon Foreground: 108x108 with 72x72 safe central viewport -->
  <defs>
    <linearGradient id="adCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42C8FF" />
      <stop offset="100%" stop-color="#488CFF" />
    </linearGradient>
    <linearGradient id="adLavViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BCA6FF" />
      <stop offset="100%" stop-color="#9667F4" />
    </linearGradient>
    <linearGradient id="adPeachChamp" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB6A0" />
      <stop offset="100%" stop-color="#FFE0B5" />
    </linearGradient>
    <radialGradient id="adCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D6" />
      <stop offset="55%" stop-color="#FFE0B5" />
      <stop offset="100%" stop-color="#FFB6A0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(4, 4)">
    <!-- Outer Halo Ring -->
    <circle cx="50" cy="50" r="34" stroke="url(#adCyanBlue)" stroke-width="2" opacity="0.45" />

    <!-- Ribbon 1: Electric Cyan to Ocean Blue -->
    <path
      d="M 50 20 C 32 20 20 34 20 50 C 20 64 34 80 50 80 C 38 70 34 56 40 44 C 45 34 50 26 50 20 Z"
      fill="url(#adCyanBlue)"
      opacity="0.95"
    />

    <!-- Ribbon 2: Soft Lavender to Violet -->
    <path
      d="M 50 20 C 68 20 80 34 80 50 C 80 64 66 80 50 80 C 62 70 66 56 60 44 C 55 34 50 26 50 20 Z"
      fill="url(#adLavViolet)"
      opacity="0.9"
    />

    <!-- Ribbon 3: Warm Peach to Champagne -->
    <path
      d="M 28 50 C 38 38 62 38 72 50 C 62 62 38 62 28 50 Z"
      fill="url(#adPeachChamp)"
      opacity="0.92"
    />

    <!-- Central Luminous Core -->
    <circle cx="50" cy="50" r="12" fill="url(#adCoreGlow)" />
    <circle cx="50" cy="50" r="4.5" fill="#FFF4D6" />
    <circle cx="50" cy="50" r="2" fill="#FFFFFF" />
  </g>
</svg>
